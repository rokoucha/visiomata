name: CI

on:
  push:
    branches: ['renovate/**']
  pull_request:
  workflow_call:

permissions:
  contents: read

# Renovate branch automerge depends on push checks surviving concurrent PR checks.
# Cancelling reusable checks on main would interrupt the distribution that depends on them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/renovate/') }}

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      # Gradle exports to the local Collector relay (started below); the Collector
      # attaches backend auth. The backend URL secret is consumed by the Collector.
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://127.0.0.1:4318/v1/traces
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
      OTEL_RESOURCE_ATTRIBUTES: >-
        github.workflow=${{ github.workflow }},
        github.event_name=${{ github.event_name }},
        git.branch=${{ github.head_ref || github.ref_name }},
        github.run_id=${{ github.run_id }},
        github.run_attempt=${{ github.run_attempt }},
        github.actor=${{ github.actor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-otel-collector
        with:
          api-key: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      - uses: ./.github/actions/setup-build
      - name: Create Firebase configuration for build checks
        # Fork PRs can build without access to the real Firebase project or secrets.
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = {
              "project_info": {"project_number": "1234567890", "project_id": "visiomata-ci"},
              "client": [{
                  "client_info": {
                      "mobilesdk_app_id": "1:1234567890:android:0000000000000000000000",
                      "android_client_info": {"package_name": "net.rokoucha.visiomata.debug"},
                  },
                  "api_key": [{"current_key": "AIzaSyCIPlaceholderNotARealFirebaseAPIKey"}],
              }],
              "configuration_version": "1",
          }
          Path("app/google-services.json").write_text(json.dumps(config))
          PY
      - name: Check and build debug APK
        run: >-
          ./gradlew --no-configuration-cache --parallel --max-workers=2
          spotlessCheck testDebugUnitTest lintDebug
          detektDebug detektDebugUnitTest detektDebugAndroidTest
          :app:assembleDebug
