name: Set up Android build
description: Install the Java, Android, Rust, and Node.js toolchains used by Visiomata
inputs:
  cache-disabled:
    description: Disable Gradle caching for jobs that handle signing credentials
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: jetbrains
        java-version: '25'
    - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      with:
        cache-disabled: ${{ inputs.cache-disabled }}
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '24'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
    - name: Install Android SDK packages
      shell: bash
      run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
    - name: Install Rust targets
      shell: bash
      run: |
        rustup toolchain install 1.88.0 --profile minimal --target aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
        echo 'RUSTUP_TOOLCHAIN=1.88.0' >> "$GITHUB_ENV"
