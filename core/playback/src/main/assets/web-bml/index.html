<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    #data-broadcasting-browser {
      position: absolute;
      inset: 0;
      overflow: hidden;
      transform-origin: left top;
      contain: layout paint;
    }
    .data-broadcasting-browser-content {
      position: absolute;
      inset: 0;
      contain: layout paint;
    }
    .arib-video-invisible-container, .arib-video-container, #arib-video {
      width: 100%; height: 100%; background: transparent !important;
    }
    /* Media3 owns video and captions. web-bml only needs the empty mediaElement as the logical
       ARIB video plane; allowing its HTMLVideoElement to participate in painting creates an
       opaque black/white rectangle above the native video surface. */
    #arib-video { display: none !important; visibility: hidden !important; opacity: 0 !important; }
    .data-broadcasting-browser-content object[type^="video"],
    .data-broadcasting-browser-content object[arib-type="video/X-arib-mpeg2"] {
      background: transparent !important;
    }
    .arib-video-cc-container { display: none; position: absolute; inset: 0; }
    .overlay-input-container { display: none; position: absolute; z-index: 10; inset: 35% 10% auto; padding: 16px; background: #111; color: white; }
    .remote-control-status-container {
      position: absolute;
      right: 20px;
      bottom: 20px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      pointer-events: none;
    }
    .remote-control-status {
      padding: 6px 12px;
      border-radius: 4px;
      color: white;
      background: rgb(0 0 0 / 72%);
      font: bold 20px/1.4 sans-serif;
      text-shadow: 0 1px 2px black;
    }
    .remote-control-status[hidden] { display: none; }
    #remote-control, #ts, #url, #url-submit, #url-err { display: none; }
  </style>
</head>
<body>
  <input type="file" id="ts"><input id="url"><button id="url-submit"></button><pre id="url-err"></pre>
  <div id="data-broadcasting-browser">
    <div class="data-broadcasting-browser-content"></div>
    <div class="arib-video-invisible-container"><div class="arib-video-container"><video id="arib-video" muted autoplay style="display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important"></video></div></div>
    <div class="arib-video-cc-container"></div>
    <div class="overlay-input-container">
      <div>文字入力</div><input type="text"><button class="submit">確定</button><button class="cancel">キャンセル</button>
    </div>
    <div class="remote-control-status-container" aria-live="polite">
      <div class="remote-control-receiving-status remote-control-status" hidden>データ受信中...</div>
      <div class="remote-control-networking-status remote-control-status" hidden>通信中...</div>
    </div>
  </div>
  <div id="remote-control"><div class="remote-control-indicator"></div></div>
  <script src="play_local.js"></script>
</body>
</html>
